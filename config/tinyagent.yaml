# Model-neutral TinyAgent configuration template.
# Concrete model implementations are selected by evaluation and can be replaced
# without changing functional requirements.

agent:
  max_iterations: 8
  context_minify:
    enabled: true
    interval_tokens: 4096

decision:
  enabled: true
  types: [choice, score, boolean]
  parallel_independent: true
  confidence:
    enabled: true
    fallback_threshold: 0.70
    confirm_threshold: 0.50
    human_threshold: 0.50

routing:
  default_role: small-capability
  roles:
    decision: decision-model
    fast: fast-capability
    small: small-capability
    medium: medium-capability
    strong: strong-capability
    specialist: specialist-capability
  rules:
    - when: "privacy == true"
      action: "local-only"
    - when: "confidence < configured threshold"
      action: "fallback"
    - when: "difficulty requires stronger capability"
      action: "stronger-role"
    - when: "task.category == image"
      action: "specialist-role"

guardrails:
  prompt_injection_detection: true
  sensitive_data_detection: true
  abuse_detection: true
  policy_violation_detection: true

tool_gating:
  enabled: true
  decisions: [allow, confirm, deny]
  default_on_low_confidence: confirm

batch_decisions:
  enabled: true
  max_batch_size: 32

reranking:
  enabled: true

bulk_labeling:
  enabled: true

real_time:
  enabled: true
  max_decision_latency_ms: 300

evaluation:
  enabled: true
  criteria:
    - quality
    - latency
    - throughput
    - memory
    - cost
    - tool_reliability
    - decision_calibration
  automatic_role_assignment: false

model_registry:
  enabled: true
  model_names_are_configuration_only: true

cache:
  data:
    enabled: true
    ttl_seconds: 300
  context:
    enabled: true
  inference_prefix_kv:
    delegated_to_model_adapter: true
  result:
    enabled: false
  invalidation:
    strategy: targeted

preflight:
  current_words: [latest, current, today, now, recent, recently, newest, updated, currently, this week, this month]
  file_phrases: [my code, my project, this file, repository, repo, codebase, local config, local logs]
  domain_words: [github, jira, azure, aws, deployment, production, logs, metrics, monitoring, ticket, issue, pull request, branch, commit, resource group, database, environment]
  state_words: [my, our, this, status, running, deployed, configured, failed, failure, logs, metrics, production, environment]

nfr:
  security:
    enabled: true
  audit:
    enabled: true
  telemetry:
    enabled: true
  health_checks:
    enabled: true
  resource_budgets:
    enabled: true
